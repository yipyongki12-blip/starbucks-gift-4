<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:sans-serif;color:#111827}.app{max-width:700px;margin:auto;padding:24px 16px}h1{font-size:32px;margin:8px 0}.sub{color:#6b7280;margin-bottom:22px}.box,.task{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:14px;margin-bottom:10px}.row{display:flex;gap:8px}input,select,button{font-size:16px;border-radius:12px;border:1px solid #d1d5db;padding:13px}#text{flex:1;min-width:0}button{background:#111827;color:white;border:0;font-weight:700}.opts{display:flex;gap:8px;margin-top:8px}.opts>*{flex:1}.task{display:flex;align-items:center;gap:12px}.task input{width:22px;height:22px}.content{flex:1}.done{text-decoration:line-through;color:#9ca3af}.meta{font-size:12px;color:#6b7280;margin-top:4px}.del{background:#fff;color:#b91c1c;padding:8px}.stats{margin:14px 2px;color:#6b7280;font-size:14px}</style></head><body><div class="app"><div style="font-size:12px;font-weight:700;color:#6b7280">PERSONAL TASK MANAGER</div><h1>My To Do</h1><div class="sub">입력한 내용은 자동 저장됩니다.</div><div class="box"><div class="row"><input id="text" placeholder="할 일을 입력하세요"><button onclick="add()">추가</button></div><div class="opts"><select id="priority"><option value="보통">우선순위: 보통</option><option value="높음">우선순위: 높음</option><option value="낮음">우선순위: 낮음</option></select><input type="date" id="due"></div></div><div class="stats" id="stats"></div><div id="list"></div></div><script>const KEY='todo.v1';let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){};const $=x=>document.getElementById(x);function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}function add(){let v=$('text').value.trim();if(!v)return;tasks.unshift({id:Date.now(),text:v,done:false,p:$('priority').value,due:$('due').value});$('text').value='';save();render()}function toggle(id){let t=tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}function del(id){tasks=tasks.filter(x=>x.id!==id);save();render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){$('stats').textContent='전체 '+tasks.length+' · 진행 '+tasks.filter(x=>!x.done).length+' · 완료 '+tasks.filter(x=>x.done).length;$('list').innerHTML=tasks.map(t=>'<div class="task"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle('+t.id+')"><div class="content"><div class="'+(t.done?'done':'')+'">'+esc(t.text)+'</div><div class="meta">우선 '+t.p+(t.due?' · 마감 '+t.due:'')+'</div></div><button class="del" onclick="del('+t.id+')">삭제</button></div>').join('')||'<div class="box" style="text-align:center;color:#9ca3af">할 일을 추가해 보세요.</div>'} $('text').addEventListener('keydown',e=>{if(e.key==='Enter')add()});render();</script></body></html>
