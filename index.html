<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta property="og:title" content="[카카오톡 선물하기]">
    <meta property="og:description" content="이병기님이 선물을 보냈습니다.">
    <meta property="og:image" content="https://raw.githubusercontent.com/tldus2355/man-fool-2026/main/image_18.png"> 

    <title>카카오톡 선물하기</title>
    <style>
        body { margin: 0; padding: 0; background-color: #b2c7d9; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        .gift-card { background-color: white; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin: auto; overflow: hidden; }
        .gift-header { background-color: #fee500; height: 180px; display: flex; justify-content: center; align-items: center; }
        .gift-icon { font-size: 80px; } /* 🎁 이모티콘 크기 키우기 */
        .gift-body { padding: 30px; }
        .gift-sender { font-size: 14px; color: #777; margin-bottom: 10px; } /* 이병기님이... */
        .gift-product { font-size: 18px; font-weight: bold; color: #111; line-height: 1.5; } /* [스타벅스] 촉촉한 디저트 세트... */
        .gift-message-box { background-color: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 20px; margin-bottom: 20px; }
        .gift-message { font-size: 14px; color: #333; line-height: 1.5; } /* 오늘 하루도 고생 많다!... */
        .gift-deadline { font-size: 14px; color: #777; margin-top: 10px; } /* 배송지 입력 기한... */
        .btn { display: block; width: 100%; padding: 14px 0; text-align: center; background-color: #f5f5f5; color: #111; font-weight: bold; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="gift-card">
        <div class="gift-header">
            <span class="gift-icon">🎁</span> </div>
        <div class="gift-body">
            <div class="gift-sender">이병기님이 선물을 보냈습니다.</div>
            <div class="gift-product">[스타벅스] 촉촉한 디저트 세트<br>(아메리카노 T 2잔 + 생크림 카스텔라)</div>
            
            <div class="gift-message-box">
                <p class="gift-message">오늘 하루도 고생 많다! 커피 한잔하면서 쉬어~</p>
                <p class="gift-deadline">배송지 입력 기한이 1일 남았습니다.</p>
            </div>
            
            <button class="btn" onclick="alert('어림없지 ㅋㅋㅋ 만우절이다!\n커피는 각자 믹스커피 타 먹는 걸로 하자 ^^\n오늘 하루도 안전 근무!!')">선물 받기</button>
        </div>
    </div>
</div>

</body>
</html>
