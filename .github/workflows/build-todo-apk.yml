name: Build ToDo APK
on:
  push:
    branches: [todo-apk-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Build APK
        working-directory: todo-app
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp todo-app/app/build/outputs/apk/debug/app-debug.apk ToDo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ToDo-APK
          path: ToDo.apk
